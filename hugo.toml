baseURL = "https://lichuangnus.github.io/"
title = "Victor|Li Chuang's Personal Webpage"
theme = "hugo-coder"
locale = "en"
defaultContentLanguage = "en"
enableEmoji = true

[pagination]
pagerSize = 6

[markup]
[markup.highlight]
noClasses = false

[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

[params]
author = "Victor Li Chuang"
description = "Victor Li Chuang's personal website"
keywords = "blog,developer,personal"
info = ["PhD"]
avatarURL = "images/avatar.jpg"
dateFormat = "January 2, 2006"
since = 2020
rtl = false
colorScheme = "auto"
hideColorSchemeToggle = false
maxSeeAlsoItems = 5
customCSS = ["css/custom.css"]
customSCSS = []
customJS = []
customRemoteJS = []

# Content-Security-Policy. IMPORTANT: values here must be actual TOML
# strings like "'self'" -- never bare words or numbers. Typing 'self
# without quotes, or pasting byte codes instead of the string, is what
# corrupted this policy across the whole site before (see about page
# history) and silently broke every page's styling.
[params.csp]
childsrc = ["'self'"]
fontsrc = ["'self'", "https://fonts.gstatic.com", "https://cdn.jsdelivr.net/"]
formaction = ["'self'"]
framesrc = ["'self'"]
imgsrc = ["'self'"]
objectsrc = ["'none'"]
stylesrc = [
  "'self'",
  "'unsafe-inline'",
  "https://fonts.googleapis.com/",
  "https://cdn.jsdelivr.net/",
]
scriptsrc = [
  "'self'",
  "'unsafe-inline'",
  "https://www.google-analytics.com",
]
prefetchsrc = ["'self'"]
connectsrc = ["'self'", "https://www.google-analytics.com"]

[[params.social]]
name = "Github"
